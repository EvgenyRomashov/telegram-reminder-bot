[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-reminder-bot"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[ext]>=21,<23",
    "SQLAlchemy>=2.0,<3",
    "APScheduler>=3.10,<4",
    "python-dotenv>=1,<2",
    "pytz>=2024.1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "freezegun",
]

[tool.setuptools.package-data]
reminder_bot = ["web/static/*"]
