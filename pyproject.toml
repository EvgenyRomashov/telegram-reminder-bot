[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-reminder-bot"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-telegram-bot[ext]",
    "SQLAlchemy",
    "APScheduler",
    "python-dotenv",
    "pytz",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
